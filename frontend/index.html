<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Trace — a timestamped record of your moments</title>
    <meta
      name="description"
      content="Capture moments as they happen and keep a private, timestamped record."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/brand/app-icon-dark.svg" />

    <meta name="theme-color" content="#15151f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;

    <div id="root"></div>
    <!--
      The design system (styles.css + ui-bundle.js) and a single global React
