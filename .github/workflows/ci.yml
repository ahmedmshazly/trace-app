name: CI

on:
  pull_request:
  push:
    branches: [main]

# Realizes the documented pipeline (docs/04-engineering/ci-cd.md) for the
# backend and frontend packages, plus a monorepo build that mirrors Vercel.
jobs:
  backend:
    name: backend · lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Cache MongoMemoryServer binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-memory-server
          key: mms-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            mms-${{ runner.os }}-

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit + integration + isolation)
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: frontend · lint · typecheck · build · e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

  vercel-build:
    name: monorepo · vercel-build parity
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (monorepo)
        run: npm run install:all

      - name: Build (monorepo)
        run: npm run vercel-build
