name: CI

on:
  pull_request:
  push:
    branches: [main]

# Realizes the documented pipeline (docs/04-engineering/ci-cd.md) for the backend
# package. A frontend job is added to the matrix when that package lands.
jobs:
  backend:
    name: backend · lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit + integration + isolation)
        run: npm test

      - name: Build
        run: npm run build
